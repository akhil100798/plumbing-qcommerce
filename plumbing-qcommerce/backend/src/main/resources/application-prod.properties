server.port=${PORT:10000}
server.address=0.0.0.0

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# HikariCP Connection Pool Production Hardening
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=PqcProdHikariPool

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
app.flyway.baseline-on-migrate=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.repositories.enabled=false

# MongoDB and Redis are excluded by default in production since PostgreSQL handles core relational state and token revocation.
spring.data.mongodb.uri=${MONGO_URI:}
spring.autoconfigure.exclude=org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration,org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration,org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration,org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration

# Kafka - disabled in prod (use empty to skip)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}

app.scheduling.enabled=${APP_SCHEDULING_ENABLED:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

security.jwt.secret=${JWT_SECRET}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Disable distributed tracing in prod (no Zipkin server on Render free tier)
management.tracing.enabled=false
management.tracing.sampling.probability=0.0
# Disable MongoDB, Redis, and Kafka health checks when services are optional/unconfigured in prod
management.health.mongo.enabled=false
management.health.mongodb.enabled=false
management.health.redis.enabled=${MANAGEMENT_HEALTH_REDIS_ENABLED:false}
management.health.kafka.enabled=false


app.otp.length=${OTP_LENGTH:6}
app.otp.expiry-seconds=${OTP_EXPIRY_SECONDS:300}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.otp.max-verify-attempts=${OTP_MAX_VERIFY_ATTEMPTS:5}
app.otp.demo-bypass-enabled=false
app.otp.demo-code=
app.otp.hash-secret=${OTP_HASH_SECRET}

app.sms.provider=${SMS_PROVIDER:none}
app.sms.local-capture-enabled=false
app.sms.fail-if-missing-provider=true

app.seed.demo-enabled=false
app.seed.catalog-enabled=false
app.seed.admin-demo-enabled=false
app.seed.fail-if-prod-demo-enabled=true
app.seed.demo-password=

# Fail-safe Payment Configuration
app.payment.provider=${APP_PAYMENT_PROVIDER:mock}
app.payment.paid-transactions-enabled=${APP_PAYMENT_PAID_TRANSACTIONS_ENABLED:false}
app.payment.fail-if-mock-in-prod=${APP_PAYMENT_FAIL_IF_MOCK_IN_PROD:true}

phase2-diagnosis-quotes.enabled=${PHASE2_DIAGNOSIS_QUOTES_ENABLED:true}

