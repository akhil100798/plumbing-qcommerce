app.sms.provider=${SMS_PROVIDER:disabled}
app.sms.local-capture-enabled=false
app.sms.fail-if-missing-provider=true

# Render staging uses the same explicit browser-origin allowlist as production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3101,http://localhost:3000}

# Actuator is exposed for Render readiness checks.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.mongo.enabled=false
management.health.mongodb.enabled=false
management.health.redis.enabled=false
management.health.kafka.enabled=false
management.tracing.enabled=false
management.tracing.sampling.probability=0.0

# Staging does not provision Kafka, MongoDB, or Redis. Disable their auto-configurations
# to prevent attempting local developer addresses and delaying service readiness.
spring.autoconfigure.exclude=org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration,org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration,org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration,org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
spring.kafka.bootstrap-servers=


# Cloudflare R2 S3-compatible Object Storage for Staging
app.photos.provider=${APP_PHOTOS_PROVIDER:r2}
app.photos.fail-if-missing-provider=${APP_PHOTOS_FAIL_IF_MISSING_PROVIDER:true}
app.photos.storage-dir=uploads/service-order-photos
app.photos.r2.account-id=${R2_ACCOUNT_ID:}
app.photos.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.photos.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.photos.r2.bucket=${R2_BUCKET_NAME:}
app.photos.r2.endpoint=${R2_ENDPOINT:}
app.photos.r2.region=${R2_REGION:auto}
