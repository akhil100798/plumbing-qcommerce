app.sms.provider=${SMS_PROVIDER:disabled}
app.sms.local-capture-enabled=false
app.sms.fail-if-missing-provider=true

# Actuator: expose health and info endpoints for Render health check path (/actuator/health)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# Disable optional/unconfigured dependencies in staging health aggregate
# These services are not provisioned in the staging environment; their
# absence must not cause the aggregate health to report DOWN.
management.health.mongo.enabled=false
management.health.mongodb.enabled=false
management.health.redis.enabled=false
management.health.kafka.enabled=false

# Disable distributed tracing — no Zipkin server in staging
management.tracing.enabled=false
management.tracing.sampling.probability=0.0