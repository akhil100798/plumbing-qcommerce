app.sms.provider=${SMS_PROVIDER:disabled}
app.sms.local-capture-enabled=false
app.sms.fail-if-missing-provider=true

# Render staging uses the same explicit browser-origin allowlist as production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3101,http://localhost:3000}

# Actuator is exposed for Render readiness checks.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.mongo.enabled=false
management.health.mongodb.enabled=false
management.health.redis.enabled=false
management.health.kafka.enabled=false
management.tracing.enabled=false
management.tracing.sampling.probability=0.0

# Staging does not provision a Kafka broker. Disable the client instead of
# retrying against a local developer address and delaying service readiness.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
spring.kafka.bootstrap-servers=
