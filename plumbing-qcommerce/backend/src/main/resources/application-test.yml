spring:
  datasource:
    url: jdbc:h2:mem:plumbing_core_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  # Disable external service auto-configurations in the test context
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
  # Use embedded Kafka broker address placeholder (overridden per test if needed)
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

# Disable Zipkin/tracing in tests to avoid connection errors
management:
  tracing:
    enabled: false
  zipkin:
    tracing:
      endpoint: ""

logging:
  level:
    org.springframework: WARN
    org.hibernate: WARN
    org.mongodb.driver: OFF
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
