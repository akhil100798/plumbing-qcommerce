spring:
  datasource:
    url: jdbc:h2:mem:plumbing_core_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  # Disable external service auto-configurations in the test context
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
  # Use embedded Kafka broker address placeholder (overridden per test if needed)
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    listener:
      auto-startup: false
    producer:
      retries: 0
      properties:
        max.block.ms: 50
        request.timeout.ms: 50

app:
  scheduling:
    enabled: false
  demo-seed:
    enabled: false
  photos:
    provider: local
    fail-if-missing-provider: false

# Disable Zipkin/tracing in tests to avoid connection errors
management:
  health:
    mongo:
      enabled: false
    mongodb:
      enabled: false
    redis:
      enabled: false
    kafka:
      enabled: false
    mail:
      enabled: false
  tracing:
    enabled: false
  zipkin:
    tracing:
      endpoint: ""

logging:
  level:
    org.springframework: WARN
    org.hibernate: WARN
